name: Build and push Docker image

on:
  workflow_call:
    inputs:
      image-name:
        description: Image repository and name, without the registry host
        required: true
        type: string
      registry:
        description: Container registry host, for example ghcr.io
        required: true
        type: string
    secrets:
      registry-username:
        description: Username used to log in to the container registry
        required: true
      registry-password:
        description: Password or token used to log in to the container registry
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ github.sha }}
